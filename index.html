      case 'del-check': commit('Control eliminado',cs=>cs.del('checks',act.dataset.id)); return;
      case 'cause': Object.assign(ui.mf,{acc:act.dataset.acc,from:'',to:act.dataset.to,cat:'',state:act.dataset.state,q:'',page:0}); go('movimientos'); return;
      case 'go-view': go(act.dataset.view); return;
      case 'new-parent': newParentCat(); return;
      case 'new-child': newChildCat(act.dataset.id); return;
      case 'ren-cat': renameCat(act.dataset.id); return;
      case 'del-cat': deleteCat(act.dataset.id); return;
      case 'paste-cats': pasteCats(); return;
      case 'backup': exportBackup(); return;
      case 'restore': $('restoreInput').click(); return;
      case 'dl-unreadable': download(JSON.stringify(S.unreadable,null,1),`finanzas-ilegibles-${stamp()}.json`,'application/json'); return;
      case 'install': installApp(); return;
    }
    return;
  }
  const sel=t.closest('input[data-sel]');
  if(sel){ sel.checked?selMov.add(sel.dataset.sel):selMov.delete(sel.dataset.sel); renderMovs(); return; }
  if(t.id==='selPage'){ const f=ui.mf, page=filteredMovs().slice(f.page*PAGE,(f.page+1)*PAGE); for(const m of page) t.checked?selMov.add(m.id):selMov.delete(m.id); renderMovs(); return; }
  if(t.closest('td.chk')) return;
  const row=t.closest('tr[data-mov]'); if(row){ openMovDialog(row.dataset.mov); return; }
  const ea=t.closest('[data-edit-acc]'); if(ea){ openAccDialog(ea.dataset.editAcc); return; }
  const ru=t.closest('tr[data-rule]'); if(ru){ openRuleDialog(ru.dataset.rule); return; }
  const am=t.closest('tr[data-acc-movs]'); if(am){ Object.assign(ui.mf,{acc:am.dataset.accMovs,from:'',to:'',cat:'',state:'',q:'',page:0}); go('movimientos'); return; }
  const fi=t.closest('[data-file]'); if(fi){ imp.sel=+fi.dataset.file; imp.sheet=0; renderImport(); return; }
  const th=t.closest('#themeSeg button[data-theme]'); if(th){ ui.theme=th.dataset.theme; saveUI(); applyTheme(); renderSettings(); return; }
});
let searchTimer=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.mf){
    ui.mf[t.dataset.mf]=t.value; ui.mf.page=0; saveUI();
    clearTimeout(searchTimer);
    if(t.dataset.mf==='q') searchTimer=setTimeout(renderMovs,200); else renderMovs();
    return;
  }
  if(t.id==='backupDays'){ const n=Math.min(90,Math.max(1,parseInt(t.value,10)||14)); ui.backupDays=n; saveUI(); renderSideNotes(); }
  if(t.id==='sheetSel'){ imp.sheet=+t.value; renderImport(); }
  if(t.dataset&&t.dataset.rv==='payee') rvEdit(+t.dataset.i,'payee',t.value);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='showArch'){ ui.showArchived=t.checked; saveUI(); renderAccounts(); return; }
  const rv=imp.files[imp.sel]?.review;
  if(rv){
    if(t.id==='rvAcc'){ rv.accountId=t.value; rv.edits.clear(); rv.setOpening=null; rv.addHint=null; rv.page=0; renderImport(); return; }
    if(t.id==='rvOpening'){ rv.setOpening=t.checked; return; }
    if(t.id==='rvHint'){ rv.addHint=t.checked; return; }
    if(t.id==='rvDups'){ rv.showDups=t.checked; rv.page=0; renderImport(); return; }
    if(t.dataset.rv&&t.dataset.rv!=='payee'){ rvEdit(+t.dataset.i,t.dataset.rv,t.value); if(t.dataset.rv==='kind'||t.dataset.rv==='categoryId') renderImport(); return; }
  }
});
document.addEventListener('keydown',e=>{
  const inField=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]');
  const dlgOpen=!!document.querySelector('dialog[open]');
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&/^Digit[1-9]$/.test(e.code)&&!dlgOpen){ e.preventDefault(); go(VIEW_KEYS[+e.code.slice(5)-1]); return; }
  if(dlgOpen||inField) return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='n'||e.key==='N'){ e.preventDefault(); openMovDialog(null); return; }
  if(e.key==='/'){ e.preventDefault(); if(ui.view!=='movimientos') go('movimientos'); $('movSearch')?.focus(); return; }
});

/* ================= Instalación y service worker ================= */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; $('installBtn').hidden=false; });
window.addEventListener('appinstalled',()=>{ deferredPrompt=null; $('installBtn').hidden=true; });
async function installApp(){ if(!deferredPrompt) return; deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; $('installBtn').hidden=true; }
$('installBtn').addEventListener('click',installApp);
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});

/* ================= Arranque ================= */
async function boot(){
  applyTheme();
  try{
    db=await openDB();
    ingest(await loadAll());
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  }catch(e){
    console.error(e);
    $('view').innerHTML=`<div class="empty">${icon('alert','ic')}<div>No se puede abrir el almacenamiento de la app: ${esc(e.message)}</div><div class="muted">Cierra las demás pestañas de Finanzas y recarga.</div></div>`;
    return;
  }
  render();
  if(getMeta('importFolder')) scanFolder(false);
}
boot();
