<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5e52">
<meta name="description" content="Importa los movimientos de los bancos, controla los saldos y prepara la exportación a Bluecoins.">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Finanzas</title>
<script>(function(){try{var u=JSON.parse(localStorage.getItem('fin_ui')||'{}'),t=u.theme;if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;if(t==='dark'){var m=document.querySelector('meta[name=theme-color]');if(m)m.content='#0b0e15';}}catch(e){}})();</script>
<style>
:root{color-scheme:light;
  --paper:#f4f5f7;--panel:#fff;--ink:#18223a;--ink-2:#3b465c;--muted:#5b6579;--faint:#8a93a5;--line:#e1e5ec;--line-strong:#cbd2de;
  --accent:#0e6e5f;--accent-ink:#0a564a;--accent-soft:#e3f2ef;--accent-line:#a9d5cc;
  --field:#fff;--hover:#f2f4f8;--chip:#eef1f6;--chip-ink:#3c475d;--subtle:#f8f9fb;--sunken:#eceff4;
  --pos:#1b7a4c;--pos-soft:#e7f4ed;--neg:#b42318;--neg-soft:#fdf0ee;--neg-line:#efc7c2;
  --warn:#9a5200;--warn-bg:#fff8ec;--warn-line:#f0d6a8;--info:#1d5f99;--info-soft:#e6f1fb;
  --nav:#132a2b;--nav-ink:#cfe0dd;--nav-muted:#86a29d;--nav-hover:rgba(255,255,255,.06);--nav-active:rgba(255,255,255,.13);
  --head-bg:rgba(244,245,247,.94);--shadow:0 12px 32px rgba(10,16,30,.18);
  --sidebar-w:236px;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=dark]{color-scheme:dark;
  --paper:#10141d;--panel:#181e2b;--field:#121722;--ink:#e4e8f1;--ink-2:#c3cad8;--muted:#a1a9ba;--faint:#727c94;--line:#272f42;--line-strong:#364056;
  --accent:#2aa58f;--accent-ink:#43c0a9;--accent-soft:#14302b;--accent-line:#25594f;
  --hover:#222a3b;--chip:#242c3e;--chip-ink:#c3cad8;--subtle:#151a26;--sunken:#121722;
  --pos:#4cc38a;--pos-soft:#13291e;--neg:#ff8a80;--neg-soft:#3a1c1e;--neg-line:#5c2a2d;
  --warn:#f0a24e;--warn-bg:#2b2113;--warn-line:#5a4220;--info:#8cc4f5;--info-soft:#16283d;
  --nav:#0b0e15;--nav-hover:rgba(255,255,255,.05);--nav-active:rgba(255,255,255,.1);
  --head-bg:rgba(16,20,29,.92);--shadow:0 12px 32px rgba(0,0,0,.5)}
:root[data-theme=dark] dialog::backdrop{background:rgba(0,0,0,.6)}
:root[data-theme=dark] .sidebar{border-right:1px solid var(--line)}
:root[data-theme=dark] .toast{border:1px solid var(--line-strong)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14.5px/1.5 var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700}
a{color:var(--accent-ink)}
.ic{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}
.ic.xs{width:13px;height:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Botones y campos */
button{font:inherit;color:inherit}
.btn{font-weight:600;border:1px solid transparent;border-radius:8px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#fff;line-height:1.25;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:hover{background:var(--accent-ink)}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line-strong)}
.btn.sec:hover{background:var(--hover)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{background:var(--panel);color:var(--neg);border-color:var(--neg-line)}
.btn.danger:hover{background:var(--neg-soft)}
.btn.icon{padding:6px;border-radius:7px}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default;pointer-events:none}
.btn:focus-visible,.inp:focus-visible,.nav-btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input.inp,select.inp,textarea.inp{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;min-width:0;width:100%;line-height:1.35}
textarea.inp{resize:vertical;min-height:64px}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.inp:disabled,select.inp:disabled{background:var(--sunken);color:var(--muted)}
input.inp.amount{text-align:right;font-variant-numeric:tabular-nums}
input.inp.bad{border-color:var(--neg)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.fld.full{grid-column:1/-1}
label.chk{display:inline-flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-ink)}
.seg button:disabled{cursor:default;opacity:.55}

/* Estructura */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:16px 10px;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:16px;color:#fff}
.brand img{width:28px;height:28px;border-radius:7px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--nav-ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;text-align:left}
.nav-btn:hover{background:var(--nav-hover);color:#fff}
.nav-btn[aria-current=page]{background:var(--nav-active);color:#fff;font-weight:600}
.nav-btn .badge{margin-left:auto}
.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:10px}
.side-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--nav-muted);padding:6px 10px;border-radius:8px;border:0;background:transparent;cursor:pointer;text-align:left;width:100%}
.side-note:hover{background:var(--nav-hover);color:#fff}
.side-note.warn{color:#f3c47a}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:700;background:var(--chip);color:var(--chip-ink)}
.sidebar .badge{background:rgba(255,255,255,.12);color:#fff}
.sidebar .badge.warn{background:#7a4f12;color:#ffe2b0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:var(--head-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:56px}
.topbar h1{font-size:19px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#menuBtn{display:none}
.view{padding:20px 24px 48px;width:100%;max-width:1480px}
.view-sec{margin-top:26px}
.view>.view-sec:first-child{margin-top:0}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-head h2{flex:1;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.empty{background:var(--panel);border:1px dashed var(--line-strong);border-radius:12px;padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}

/* Tarjetas de resumen */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card .k{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.card .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:13.5px}
.card dt{color:var(--muted)}
.card dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* Tablas */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:100%}
.tbl-wrap.tall{max-height:calc(100vh - 250px);min-height:200px}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--subtle);color:var(--muted);font-size:12px;font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr.click{cursor:pointer}
.tbl td.chk,.tbl th.chk{width:34px;padding-right:0}
.tbl td.ellip{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl td.wrap{white-space:normal}
.tbl tfoot td{position:sticky;bottom:0;background:var(--subtle);font-weight:700;border-top:1px solid var(--line)}
.tbl .sub{display:block;font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv-tbl tbody tr{content-visibility:auto;contain-intrinsic-size:auto 36px}
.amt{font-weight:600}
.amt.pos{color:var(--pos)}
.amt.neg{color:var(--neg)}
.amt.tr{color:var(--info)}
.flags{display:inline-flex;gap:4px;color:var(--faint);vertical-align:middle}
.flags .ic{width:15px;height:15px}
.flags .warn{color:var(--warn)}
.flags .ok{color:var(--pos)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--chip-ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.ok{background:var(--pos-soft);color:var(--pos)}
.chip.bad{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.state{display:inline-flex;align-items:center;gap:5px;font-weight:600;white-space:nowrap}
.state.ok{color:var(--pos)}
.state.bad{color:var(--neg)}

/* Barra de filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px}
.filters label.fld{flex:0 1 auto}
.filters .grow{flex:1 1 200px}
.f-acc{width:180px}.f-date{width:142px}.f-cat{width:200px}.f-state{width:190px}
.totals{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);margin:2px 0 10px;align-items:center}
.totals b{color:var(--ink);font-variant-numeric:tabular-nums}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.bulk select.inp{width:220px}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13.5px;color:var(--muted)}

/* Importar */
.drop{border:2px dashed var(--line-strong);border-radius:12px;padding:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--panel);transition:background .15s,border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.folder-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13.5px}
.file-list{display:flex;flex-direction:column;gap:6px}
.file-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;min-width:0}
.file-item:hover{background:var(--hover)}
.file-item[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.file-item .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .meta{font-size:12.5px;color:var(--muted)}
.file-item .grow{flex:1;min-width:0}
.prev-tbl td{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.prev-tbl td.rn,.prev-tbl th.rn{color:var(--faint);text-align:right;background:var(--subtle)}
.prev-tbl td.t-n,.prev-tbl td.t-d{text-align:right}
.prev-tbl td.t-d{color:var(--info)}

/* Revisión de la importación */
.rv-grid{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.rv-grid .k{font-size:12px;font-weight:600;color:var(--muted)}
.rv-acc{width:260px}
.rv-opts{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.warns{list-style:none;margin:12px 0 0;padding:10px 12px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:9px;color:var(--warn);display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.warns li{display:flex;gap:7px;align-items:flex-start}
.warns .ic{margin-top:3px}
.rv-tbl select.inp,.rv-tbl input.inp{padding:3px 6px;font-size:13px}
.rv-tbl td:nth-last-child(3){min-width:130px}.rv-tbl td:nth-last-child(2){min-width:190px}.rv-tbl td:nth-last-child(1){min-width:150px}
.tbl tr.dup td{color:var(--faint)}
/* Categorías */
.cat-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cat-list{list-style:none;margin:0;padding:0}
.cat-list li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;min-width:0}
.cat-list li:hover{background:var(--hover)}
.cat-list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-list li.parent{font-weight:700;margin-top:6px}
.cat-list li.child{padding-left:26px}
.cat-list li .acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.cat-list li:hover .acts,.cat-list li:focus-within .acts{opacity:1}

/* Ajustes e instrucciones */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.set-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.doc{max-width:860px}
.doc h2{margin:22px 0 8px}
.doc h2:first-child{margin-top:0}
.doc p,.doc li{color:var(--ink-2)}
.doc ol,.doc ul{padding-left:22px;margin:6px 0}
.doc kbd{font:600 12px var(--font);background:var(--chip);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px}
.doc .path{font-weight:600;color:var(--ink)}
.doc table{border-collapse:collapse;font-size:13.5px}
.doc td{padding:4px 14px 4px 0;vertical-align:top}

/* Diálogos */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog.narrow{width:min(440px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(15,20,35,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 26px)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{flex:1;min-width:0}
.dlg-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg-foot{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-foot .sp{flex:1}
.note{font-size:13px;color:var(--muted)}
.hint-line{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.calc{display:grid;grid-template-columns:auto auto;justify-content:start;gap:3px 16px;font-size:13.5px;background:var(--subtle);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.calc dt{color:var(--muted)}.calc dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.raw{white-space:pre-line;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--sunken);border-radius:7px;padding:6px 8px;color:var(--ink-2);overflow-wrap:anywhere}
.causes{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.causes li{display:flex;align-items:center;gap:8px;font-size:13px}

/* Avisos */
#toastWrap{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--nav);color:#fff;padding:9px 8px 9px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:min(600px,calc(100vw - 32px));animation:toast-in .2s ease-out}
.toast.err{background:#7a1d16}
.toast .msg{flex:1;min-width:0}
.toast .btn{background:rgba(255,255,255,.14);color:#fff;padding:5px 10px}
.toast .btn:hover{background:rgba(255,255,255,.24)}
.toast .btn.x{background:transparent;padding:5px}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.drawer-bg{display:none}

/* Ventana estrecha o móvil */
@media (max-width:760px){
  #menuBtn{display:inline-flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100dvh;width:min(290px,86vw);z-index:400;transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(16px + env(safe-area-inset-top))}
  body.drawer-open .sidebar{transform:none;box-shadow:12px 0 40px rgba(10,16,30,.35)}
  body.drawer-open .drawer-bg{display:block;position:fixed;inset:0;z-index:390;background:rgba(10,16,30,.4)}
  .topbar{padding:8px 12px;gap:8px}
  .topbar h1{font-size:17px}
  .top-actions .btn .lbl{display:none}
  .view{padding:14px 12px 40px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .cat-cols{grid-template-columns:minmax(0,1fr)}
  .filters label.fld{flex:1 1 140px}
  .filters .inp{width:100%}
  .tbl-wrap.tall{max-height:none}
  .cards{grid-template-columns:minmax(0,1fr)}
  .set-grid{grid-template-columns:minmax(0,1fr)}
  .cat-list li .acts{opacity:1}
  .rv-acc{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Movimiento -->
<dialog id="movDlg"><form class="dlg" id="movForm" novalidate>
  <div class="dlg-head"><h2 id="movTitle">Movimiento</h2><button type="button" class="btn ghost icon" data-close aria-label="Cerrar"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="dlg-body">
    <div class="seg" id="movKind" role="group" aria-label="Tipo de movimiento">
      <button type="button" data-kind="gasto"><svg class="ic sm"><use href="#i-out"/></svg>Gasto</button>
      <button type="button" data-kind="ingreso"><svg class="ic sm"><use href="#i-in"/></svg>Ingreso</button>
      <button type="button" data-kind="transferencia"><svg class="ic sm"><use href="#i-swap"/></svg>Transferencia</button>
    </div>
    <div class="hint-line" id="movLockLine" hidden><svg class="ic xs"><use href="#i-lock"/></svg><span>Importado del banco: cuenta, fecha e importe no se pueden cambiar.</span></div>
    <div class="form-grid">
      <label class="fld">Cuenta<select class="inp" id="movAcc"></select></label>
      <label class="fld">Fecha<input class="inp" type="date" id="movDate" required></label>
      <label class="fld">Importe (€)<input class="inp amount" type="text" inputmode="decimal" id="movAmount" autocomplete="off" placeholder="0,00"></label>
      <label class="fld" id="movOtherWrap">Cuenta de destino<select class="inp" id="movOther"></select></label>
      <label class="fld" id="movCatWrap">Categoría<select class="inp" id="movCat"></select></label>
      <label class="fld">Beneficiario<input class="inp" type="text" id="movPayee" list="payeeList" autocomplete="off"></label>
      <label class="fld full">Concepto<input class="inp" type="text" id="movConcept" autocomplete="off"></label>
      <div class="raw full" id="movRaw" hidden style="grid-column:1/-1"></div>
      <label class="fld">Etiquetas<input class="inp" type="text" id="movLabels" autocomplete="off" placeholder="viaje casa"></label>
      <div class="fld" style="justify-content:flex-end"><label class="chk"><input type="checkbox" id="movReviewed">Revisado</label></div>
      <label class="fld full">Notas<textarea class="inp" id="movNotes" rows="2"></textarea></label>
    </div>
    <div class="chips" id="movChips"></div>
  </div>
  <div class="dlg-foot">
    <button type="button" class="btn danger" id="movDelete"><svg class="ic sm"><use href="#i-trash"/></svg>Eliminar</button>
    <button type="button" class="btn sec" id="movRule"><svg class="ic sm"><use href="#i-wand"/></svg>Crear regla</button>
    <span class="sp"></span>
    <button type="button" class="btn sec" data-close>Cancelar</button>
    <button type="submit" class="btn"><svg class="ic sm"><use href="#i-check"/></svg>Guardar</button>
  </div>
</form></dialog>
<datalist id="payeeList"></datalist>

<!-- Cuenta -->
<dialog id="accDlg"><form class="dlg" id="accForm" novalidate>
  <div class="dlg-head"><h2 id="accTitle">Cuenta</h2><button type="button" class="btn ghost icon" data-close aria-label="Cerrar"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="dlg-body">
    <div class="form-grid">
      <label class="fld full">Nombre<input class="inp" type="text" id="accName" maxlength="80" required autocomplete="off"></label>
      <label class="fld">Banco<select class="inp" id="accBank"></select></label>
      <label class="fld">Tipo<select class="inp" id="accKind"></select></label>
      <label class="fld full" id="accLinkedWrap">Se carga en la cuenta<select class="inp" id="accLinked"></select></label>
      <label class="fld">Saldo de apertura (€)<input class="inp amount" type="text" inputmode="decimal" id="accOpening" autocomplete="off" placeholder="0,00"></label>
      <label class="fld">Fecha del saldo de apertura<input class="inp" type="date" id="accOpeningDate"></label>
      <label class="fld full">Identificadores en los archivos del banco<input class="inp" type="text" id="accHints" autocomplete="off" placeholder="1234, ES12…5678"></label>
      <label class="fld">Nombre en Bluecoins<input class="inp" type="text" id="accBcName" maxlength="80" autocomplete="off"></label>
      <label class="fld">Tipo en Bluecoins<input class="inp" type="text" id="accBcType" list="bcTypeList" maxlength="40" autocomplete="off"></label>
      <div class="fld full"><label class="chk"><input type="checkbox" id="accArchived">Archivada</label></div>
    </div>
  </div>
  <div class="dlg-foot">
    <button type="button" class="btn danger" id="accDelete"><svg class="ic sm"><use href="#i-trash"/></svg>Eliminar</button>
    <span class="sp"></span>
    <button type="button" class="btn sec" data-close>Cancelar</button>
    <button type="submit" class="btn"><svg class="ic sm"><use href="#i-check"/></svg>Guardar</button>
  </div>
</form></dialog>
<datalist id="bcTypeList"><option value="Banco"><option value="Efectivo"><option value="Tarjeta de Crédito"><option value="Bank"><option value="Cash"><option value="Credit Card"></datalist>

<!-- Control de saldo -->
<dialog id="chkDlg" class="narrow"><form class="dlg" id="chkForm" novalidate>
  <div class="dlg-head"><h2>Control de saldo</h2><button type="button" class="btn ghost icon" data-close aria-label="Cerrar"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="dlg-body">
    <div class="form-grid">
      <label class="fld full">Cuenta<select class="inp" id="chkAcc"></select></label>
      <label class="fld">Fecha<input class="inp" type="date" id="chkDate"></label>

      <label class="fld">Saldo en Bluecoins (€)<input class="inp amount" type="text" inputmode="decimal" id="chkBc" autocomplete="off" placeholder="opcional"></label>
      <label class="fld full">Nota<input class="inp" type="text" id="chkNote" autocomplete="off"></label>
    </div>
    <dl class="calc" id="chkCalc"></dl>
  </div>
  <div class="dlg-foot"><span class="sp"></span><button type="button" class="btn sec" data-close>Cancelar</button><button type="submit" class="btn"><svg class="ic sm"><use href="#i-check"/></svg>Guardar control</button></div>
</form></dialog>

<!-- Texto (categorías, etc.) -->
<dialog id="txtDlg" class="narrow"><form class="dlg" id="txtForm" novalidate>

<!-- Confirmación -->
<dialog id="cfmDlg" class="narrow"><form class="dlg" id="cfmForm" novalidate>
  <div class="dlg-head"><h2 id="cfmTitle"></h2></div>
  <div class="dlg-body" id="cfmBody"></div>
  <div class="dlg-foot"><span class="sp"></span><button type="button" class="btn sec" data-close>Cancelar</button><button type="submit" class="btn" id="cfmOk">Aceptar</button></div>

<!-- Regla -->
<dialog id="ruleDlg"><form class="dlg" id="ruleForm" novalidate>
  <div class="dlg-head"><h2 id="ruleTitle">Regla</h2><button type="button" class="btn ghost icon" data-close aria-label="Cerrar"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="dlg-body">
    <div class="form-grid">
      <label class="fld">Si el concepto…<select class="inp" id="ruleMode"><option value="contiene">contiene</option><option value="empieza">empieza por</option><option value="regex">cumple la expresión regular</option></select></label>
      <label class="fld">Texto<input class="inp" type="text" id="ruleText" maxlength="200" autocomplete="off"></label>
      <label class="fld">Cuenta<select class="inp" id="ruleAcc"></select></label>
      <label class="fld">Importe<select class="inp" id="ruleSign"><option value="">Cargos y abonos</option><option value="neg">Solo cargos (negativos)</option><option value="pos">Solo abonos (positivos)</option></select></label>
      <label class="fld">Tipo<select class="inp" id="ruleKind"><option value="">Según la categoría</option><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option><option value="transferencia">Transferencia</option></select></label>
      <label class="fld" id="ruleCatWrap">Categoría<select class="inp" id="ruleCat"></select></label>
      <label class="fld" id="ruleOtherWrap">Cuenta de la transferencia<select class="inp" id="ruleOther"></select></label>
      <label class="fld">Beneficiario<input class="inp" type="text" id="rulePayee" maxlength="120" list="payeeList" autocomplete="off"></label>
      <label class="fld">Etiquetas<input class="inp" type="text" id="ruleLabels" autocomplete="off"></label>
    </div>
    <dl class="calc" id="ruleCount"></dl>
    <label class="chk"><input type="checkbox" id="ruleApply" checked>Aplicar ahora a los movimientos sin categoría que coincidan</label>
  </div>
  <div class="dlg-foot">
    <button type="button" class="btn danger" id="ruleDelete"><svg class="ic sm"><use href="#i-trash"/></svg>Eliminar</button>
    <span class="sp"></span>
    <button type="button" class="btn sec" data-close>Cancelar</button>
    <button type="submit" class="btn"><svg class="ic sm"><use href="#i-check"/></svg>Guardar</button>
  </div>
</form></dialog>

}

function excelSerialToYMD(n){
  if(typeof n!=='number'||!(n>=1&&n<2958466)) return null;
  const d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*864e5);
  return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());

/* Fecha de una celda: número de serie, dd/mm/aaaa, dd/mm/aa, dd-mm-aaaa, dd.mm.aaaa, ISO (con o sin hora) o aaaammdd */
function parseDateCell(v,opts={}){
  if(v==null||v==='') return null;
  if(typeof v==='number') return excelSerialToYMD(v);
  const s=String(v).trim().replace(/ /g,' ');
  let m=/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s].*)?$/.exec(s);
  if(m) return mkYMD(+m[1],+m[2],+m[3]);
  m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})(?:[\sT,].*)?$/.exec(s);
  if(m){ let y=+m[3]; if(m[3].length===2) y+=y<70?2000:1900; return opts.order==='mdy'?mkYMD(y,+m[1],+m[2]):mkYMD(y,+m[2],+m[1]); }
  m=/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/.exec(s);
  if(m) return mkYMD(+m[1],+m[2],+m[3]);
  m=/^(\d{4})(\d{2})(\d{2})$/.exec(s);
  if(m) return mkYMD(+m[1],+m[2],+m[3]);
  if(/^\d{5}(\.\d+)?$/.test(s)) return excelSerialToYMD(+s);
  return null;
}

/* Convierte texto o número a céntimos. Admite «-1.234,56 €», «1,234.56», «(12,00)», «12,00-», «+5», «1.234».
   opts.decimal: ',' o '.' cuando se sabe; si no, se deduce (por defecto, formato español). */
function parseAmount(v,opts={}){
  if(v==null) return null;
  if(typeof v==='number'){
    if(!isFinite(v)) return null;
    let s=String(Math.abs(v)); if(/e/i.test(s)) s=Math.abs(v).toFixed(10);
    return parseAmount((v<0?'-':'')+s,{decimal:'.'});
  }
  let s=String(v).trim(); if(!s) return null;
  let neg=false;
  s=s.replace(/[−‒–—]/g,'-');
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  s=s.replace(/[\s  ]/g,'').replace(/€|eur(os?)?/gi,'');
  if(/^-.*-$/.test(s)) return null;
  if(s.endsWith('-')){ neg=!neg; s=s.slice(0,-1); }
  if(s.startsWith('-')){ neg=!neg; s=s.slice(1); } else if(s.startsWith('+')) s=s.slice(1);
  s=s.replace(/'/g,'');
  if(!/^[\d.,]+$/.test(s)||!/\d/.test(s)) return null;
  let sep=null;
  const nC=(s.match(/,/g)||[]).length, nD=(s.match(/\./g)||[]).length;
  if(opts.decimal){ sep=s.includes(opts.decimal)?opts.decimal:null; }
  else if(nC&&nD) sep=s.lastIndexOf(',')>s.lastIndexOf('.')?',':'.';
  else if(nC) sep=nC===1?',':null;
  else if(nD) sep=(nD===1&&!/^[1-9]\d{0,2}\.\d{3}$/.test(s))?'.':null;
  let ip=s, fp='';
  if(sep){ const i=s.lastIndexOf(sep); ip=s.slice(0,i); fp=s.slice(i+1); if(/[.,]/.test(fp)) return null; }
  ip=ip.replace(/[.,]/g,'')||'0';
  if(!/^\d+$/.test(ip)||!/^\d*$/.test(fp)||ip.length>13) return null;
  let c=Number(ip)*100+Number((fp+'00').slice(0,2));
  if(fp.length>2&&fp[2]>='5') c+=1;
  return neg&&c?-c:c;
}

async function readXlsx(u8){
  const files=await unzip(u8,n=>/^xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|styles\.xml|worksheets\/[^/]+\.xml)$/i.test(n));
  const td=new TextDecoder();
  const get=name=>{ for(const [k,v] of files) if(k.toLowerCase()===name.toLowerCase()) return parseXML(td.decode(v)); return null; };
  const wb=get('xl/workbook.xml'); if(!wb) throw new Error('No es un libro de Excel');
  const rels=new Map(tagsNS(get('xl/_rels/workbook.xml.rels'),'Relationship').map(r=>[r.getAttribute('Id'),r.getAttribute('Target')]));
  const pr=tagsNS(wb,'workbookPr')[0], d1904=pr&&/^(1|true)$/i.test(pr.getAttribute('date1904')||'');
  const shared=tagsNS(get('xl/sharedStrings.xml'),'si').map(si=>tagsNS(si,'t').filter(t=>t.parentNode.localName!=='rPh').map(t=>t.textContent).join(''));
  const st=get('xl/styles.xml'), fmts=new Map(tagsNS(st,'numFmt').map(f=>[+f.getAttribute('numFmtId'),f.getAttribute('formatCode')]));
  const xfsEl=tagsNS(st,'cellXfs')[0];

    const rid=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||sh.getAttribute('r:id');
    let target=rels.get(rid); if(!target) continue;
    target=target.startsWith('/')?target.slice(1):'xl/'+target.replace(/^\.\//,'');
    const doc=get(target); if(!doc){ sheets.push({name:sh.getAttribute('name')||'Hoja',rows:[]}); continue; }
    const rows=[];
    for(const r of tagsNS(doc,'row')){
      const ri=(+r.getAttribute('r')||rows.length+1)-1, row=rows[ri]||(rows[ri]=[]);
      let ci=-1;
      for(const c of r.children){
        if(c.localName!=='c') continue;
        const ref=c.getAttribute('r'); ci=ref?colIndex(ref):ci+1;
        const t=c.getAttribute('t')||'n', s=+(c.getAttribute('s')||0);
        const vEl=[...c.children].find(x=>x.localName==='v'); const v=vEl?vEl.textContent:null;
        let cell=null;

        else if(t==='inlineStr') cell={v:tagsNS(c,'t').map(x=>x.textContent).join(''),t:'s'};
        else if(t==='str'&&v!=null) cell={v,t:'s'};
        else if(t==='b'&&v!=null) cell={v:v==='1',t:'b'};
        else if(t==='e'&&v!=null) cell={v,t:'e'};
        else if(v!=null&&v!==''){ const n=+v; cell=isNaN(n)?{v,t:'s'}:xfDate[s]?{v:n+(d1904?1462:0),t:'d',raw:v}:{v:n,t:'n',raw:v}; }
        if(cell) row[ci]=cell;

function readHtmlTables(text){
  const doc=new DOMParser().parseFromString(text,'text/html');
  return [...doc.querySelectorAll('table')].map((tb,i)=>{
    const rows=[];
    for(const tr of tb.querySelectorAll('tr')){
      if(tr.closest('table')!==tb) continue;
      const row=[];
      for(const td of tr.children){
        if(td.localName!=='td'&&td.localName!=='th') continue;
        const t=cleanCellText(td.textContent); row.push(t===''?null:{v:t,t:'s'});
        for(let k=1;k<(+td.getAttribute('colspan')||1);k++) row.push(null);

/* CSV: separador ; , o tabulador, con comillas */
function parseCsv(text,sep){
  const rows=[]; let row=[], f='', q=false, i=0;
  const pushF=()=>{ row.push(f); f=''; };
  while(i<text.length){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"'&&f==='') q=true;
    else if(c===sep) pushF();
    else if(c==='\n'||c==='\r'){ pushF(); rows.push(row); row=[]; if(c==='\r'&&text[i+1]==='\n') i++; }
    else f+=c;
    i++;

  if(f!==''||row.length){ pushF(); rows.push(row); }
  return rows;
}
function detectSep(text){
  const sample=text.split(/\r?\n/).filter(l=>l.trim()).slice(0,30).join('\n');
  let best=';', bestScore=-1;
  for(const sep of [';',',','\t','|']){
    const counts=parseCsv(sample,sep).map(r=>r.length).filter(n=>n>1);
    if(!counts.length) continue;
    const freq={}; for(const n of counts) freq[n]=(freq[n]||0)+1;
    const [mode,times]=Object.entries(freq).sort((a,b)=>b[1]-a[1]||b[0]-a[0])[0];
    const score=times*Math.min(+mode,12);
    if(score>bestScore){ bestScore=score; best=sep; }
  }
  return best;
}

/* Punto de entrada: bytes → {format, formatLabel, encoding, sheets, error} */
async function readSpreadsheetBytes(u8){
  const kind=sniff(u8);
  if(kind==='zip'){
    try{ return {format:'xlsx',formatLabel:'Excel (.xlsx)',sheets:await readXlsx(u8)}; }
    catch(e){ return {format:'zip',formatLabel:'ZIP',sheets:[],error:e.message}; }
  }
  if(kind==='biff'){
    try{ return {format:'biff',formatLabel:'Excel 97-2003 (.xls)',sheets:readBiff(u8)}; }
    catch(e){ return {format:'biff',formatLabel:'Excel 97-2003 (.xls)',sheets:[],error:e.message}; }
  }
  const {text,encoding}=decodeText(u8);
  if(kind==='markup'){
    const head=text.slice(0,6000).toLowerCase();
    if(head.includes('urn:schemas-microsoft-com:office:spreadsheet')){
      try{ return {format:'xml2003',formatLabel:'XML de Excel 2003',encoding,sheets:readXml2003(text)}; }
      catch(e){ return {format:'xml2003',formatLabel:'XML de Excel 2003',encoding,sheets:[],error:e.message}; }
    }
    const sheets=readHtmlTables(text);
    return {format:'html',formatLabel:'HTML con tablas',encoding,sheets,error:sheets.length?undefined:'No contiene tablas'};
  }
  const sep=detectSep(text);
  const rows=parseCsv(text,sep).map(r=>r.map(v=>{ const t=v.trim(); return t===''?null:{v:t,t:'s'}; }));
  while(rows.length&&rows[rows.length-1].every(c=>c==null)) rows.pop();
  return {format:'csv',formatLabel:'CSV ('+SEP_NAMES[sep]+')',encoding,sep,sheets:[{name:'CSV',rows}]};
}
async function readSpreadsheet(file){
  const buf=await file.arrayBuffer(), u8=new Uint8Array(buf);
  const [hash,res]=await Promise.all([sha256Hex(buf),readSpreadsheetBytes(u8).catch(e=>({format:'?',formatLabel:'Desconocido',sheets:[],error:e.message}))]);
  return Object.assign({name:file.name,size:file.size,lastModified:file.lastModified,hash},res);
}
function cellText(c){
  if(!c) return '';
  if(c.t==='d') return typeof c.v==='number'?fmtDate(excelSerialToYMD(c.v)):fmtDate(parseDateCell(c.v))||String(c.v);
  if(c.t==='n') return c.raw??String(c.v);
  if(c.t==='b') return c.v?'VERDADERO':'FALSO';
  return String(c.v);
}

/* ================= Almacenamiento (IndexedDB) ================= */
let db=null;
function openDB(){

    if(!window.indexedDB){ rej(new Error('Este navegador no tiene IndexedDB')); return; }
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{
      const d=r.result;
      for(const s of STORES){
        if(d.objectStoreNames.contains(s)) continue;
        const os=d.createObjectStore(s,{keyPath:s==='meta'?'key':'id'});
        if(s==='movements'){ os.createIndex('accountDate',['accountId','date']); os.createIndex('fingerprint','fingerprint'); os.createIndex('importId','importId'); }
      }
    };
    r.onsuccess=()=>{ const d=r.result; d.onversionchange=()=>{ d.close(); db=null; showToast('Hay una versión nueva de la app abierta en otra pestaña: recarga esta.',{error:true,timeout:0}); }; res(d); };
    r.onerror=()=>rej(r.error||new Error('Error de IndexedDB'));
    r.onblocked=()=>rej(new Error('La base de datos está bloqueada por otra pestaña'));

}
function loadAll(){
  return new Promise((res,rej)=>{
    const t=db.transaction(STORES,'readonly'), out={};
    for(const s of STORES){ const q=t.objectStore(s).getAll(); q.onsuccess=()=>{ out[s]=q.result; }; }
    t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);

}

let writeChain=Promise.resolve();

    const t=db.transaction([...new Set(entries.map(e=>e.store))],'readwrite');
    for(const e of entries){ const os=t.objectStore(e.store); if(e.value===undefined) os.delete(e.key); else os.put(e.value); }
    t.oncomplete=()=>ok(); t.onerror=()=>ko(t.error); t.onabort=()=>ko(t.error||new Error('Escritura cancelada'));
  });

}

};

/* ================= Cambios con «Deshacer» ================= */
class ChangeSet{
  constructor(){ this.touched=new Map(); }

  put(store,rec){ const key=keyOf(store,rec); this._remember(store,key); if(store!=='meta') rec.updatedAt=nowISO(); S[store].set(key,rec); return rec; }
  del(store,key){ if(!S[store].has(key)) return; this._remember(store,key); S[store].delete(key); }
  get empty(){ return this.touched.size===0; }
}

  const inverse=[...cs.touched.values()].map(t=>({store:t.store,key:t.key,value:t.old}));
  if(r===false||cs.empty){ applyMem(inverse); return false; }
  const entries=[...cs.touched.values()].map(t=>({store:t.store,key:t.key,value:clone(S[t.store].get(t.key))}));
  bumpData(); render();
  try{ await persistEntries(entries); }
  catch(e){ applyMem(inverse); render(); showSaveError(e); return false; }

  if(!opts.noUndo){ undoStack.push({msg:m,inverse,redo:entries}); if(undoStack.length>40) undoStack.shift(); }
  broadcast();
  if(m) showToast(m,opts.noUndo?{}:{action:'Deshacer',fn:undo});
  return true;
}
async function undo(){
  const u=undoStack.pop();
  if(!u){ showToast('No hay nada que deshacer'); return; }
  applyMem(u.inverse); render();
  try{ await persistEntries(u.inverse.map(e=>({...e,value:clone(e.value)}))); broadcast(); showToast('Deshecho'+(u.msg?': '+u.msg.charAt(0).toLowerCase()+u.msg.slice(1):'')); }
  catch(e){ applyMem(u.redo); render(); showSaveError(e); }
}

  return {inc,exp,save:inc-exp,rate:inc>0?(inc-exp)/inc:null};
}
const dupKeys=()=>cached('dups',()=>{ const cnt=new Map(); for(const m of S.movements.values()){ const k=m.accountId+'|'+m.date+'|'+m.amountCents+'|'+normText(movConcept(m)); cnt.set(k,(cnt.get(k)||0)+1); } return new Set([...cnt].filter(([,n])=>n>1).map(([k])=>k)); });
const isDup=m=>dupKeys().has(m.accountId+'|'+m.date+'|'+m.amountCents+'|'+normText(movConcept(m)));
const lastImportByAcc=()=>cached('lastImp',()=>{ const out=new Map(); for(const i of S.imports.values()){ if(!i.accountId) continue; const p=out.get(i.accountId); if(!p||(i.at||'')>(p.at||'')) out.set(i.accountId,i); } return out; });
function lastCheck(accId){ let best=null; for(const c of S.checks.values()) if(c.accountId===accId&&(!best||c.date>best.date||(c.date===best.date&&c.createdAt>best.createdAt))) best=c; return best; }
function checkLive(c){ const app=balanceAt(c.accountId,c.date); return {app,diff:app-c.realCents,bcDiff:c.bluecoinsCents==null?null:c.bluecoinsCents-c.realCents}; }
function causesFor(accId,date){
  const a=S.accounts.get(accId), out=[];
  if(a&&!a.openingDate) out.push({k:'apertura',label:'Falta la fecha del saldo de apertura de la cuenta',view:'cuentas'});
  const ms=[...S.movements.values()].filter(m=>m.accountId===accId&&m.date<=date);
  const n=f=>ms.filter(f).length;
  const pend=n(m=>m.pending), un=n(m=>m.kind==='transferencia'&&!m.transferPairId), man=n(m=>m.source==='manual'), dup=n(isDup);
  if(dup) out.push({k:'dups',label:`${dup} posibles duplicados`});
  if(pend) out.push({k:'pend',label:`${pend} movimientos pendientes sin consolidar`});
  if(un) out.push({k:'sinpareja',label:`${un} transferencias sin pareja`});
  if(man) out.push({k:'manual',label:`${man} movimientos manuales`});
  const last=ms.reduce((x,m)=>m.date>x?m.date:x,'');
  if(!last) out.push({k:'vacio',label:'No hay movimientos de esta cuenta hasta esa fecha'});
  else if(daysBetween(last,date)>7) out.push({k:'hueco',label:`Sin movimientos desde el ${fmtDate(last)}`});
  if(a&&a.openingDate&&ms.some(m=>m.date<a.openingDate)) out.push({k:'antes',label:'Hay movimientos anteriores a la fecha de apertura (no cuentan)'});
  return out;
}

/* ================= Exportación CSV para Bluecoins (formato a confirmar con la calibración) ================= */
/* Cabecera exacta de la plantilla estándar de Bluecoins (Bluecoins_CSV_Standard_Template.csv) */
const BC_HEADER=['(1)Type','(2)Date','(3)Item or Payee','(4)Amount','(5)Category Type','(6)Category','(7)Account Type','(8)Account','(9)Notes','(10) Label','(11) Status','(12) Split'];
const BC_TRANSFER_CAT='(Transferir)';
function csvField(v,sep=','){ v=v==null?'':String(v); return (v.includes(sep)||/["\r\n]/.test(v)||/^\s|\s$/.test(v))?'"'+v.replace(/"/g,'""')+'"':v; }
function bluecoinsCsv(rows,{header=BC_HEADER,bom=false,eol='\r\n'}={}){
  const lines=[header.map(h=>csvField(h)).join(',')];
  for(const r of rows) lines.push([r.type,r.date,r.payee,r.amount,r.parent,r.category,r.accountType,r.account,r.notes,r.labels,r.status,r.split].map(v=>csvField(v)).join(','));
  return (bom?'﻿':'')+lines.join(eol)+eol;
}
const bcDate=s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m?`${m[3]}/${m[2]}/${m[1]}`:''; };
/* Movimientos → filas de Bluecoins. Las transferencias salen en dos filas seguidas: primero la salida (negativa) y luego la entrada. */
function movementsToBluecoinsRows(movs){
  const rows=[], done=new Set(), errors=[];
  const acc=id=>{ const a=S.accounts.get(id); return a?{name:a.bluecoins.name||a.name,type:a.bluecoins.type||'Banco'}:null; };
  const cat=id=>{ const c=S.categories.get(id); const p=c&&c.parent&&S.categories.get(c.parent); return c&&p?{parent:p.name,category:c.name}:null; };
  for(const m of movs){
    if(done.has(m.id)) continue; done.add(m.id);
    const a=acc(m.accountId); if(!a){ errors.push({id:m.id,error:'Cuenta desconocida'}); continue; }
    const base={payee:m.payee||movConcept(m),notes:m.notes,labels:m.labels.join(' '),status:'',split:'',date:bcDate(m.date)};
    if(m.kind==='transferencia'){
      const pair=m.transferPairId?[...S.movements.values()].find(x=>x.transferPairId===m.transferPairId&&x.id!==m.id):null;
      const otherId=pair?pair.accountId:m.transferAccountId, o=acc(otherId);
      if(!o){ errors.push({id:m.id,error:'Transferencia sin cuenta de destino'}); continue; }
      if(pair) done.add(pair.id);
      const amt=Math.abs(m.amountCents);
      const outA=m.amountCents<0?a:o, inA=m.amountCents<0?o:a;
      /* Las dos cuentas son la misma en Bluecoins (p. ej. tarjeta que se apunta en la cuenta del banco): no hay nada que pasar */
      if(outA.name===inA.name&&outA.type===inA.type){ errors.push({id:m.id,error:'Transferencia dentro de la misma cuenta de Bluecoins',skip:true}); continue; }
      rows.push({...base,type:'t',amount:centsToPlain(-amt),parent:BC_TRANSFER_CAT,category:BC_TRANSFER_CAT,accountType:outA.type,account:outA.name});
      rows.push({...base,type:'t',amount:centsToPlain(amt),parent:BC_TRANSFER_CAT,category:BC_TRANSFER_CAT,accountType:inA.type,account:inA.name});
      continue;
    }
    const c=cat(m.categoryId); if(!c){ errors.push({id:m.id,error:'Sin categoría'}); continue; }
    rows.push({...base,type:m.kind==='ingreso'?'i':'e',amount:centsToPlain(m.amountCents),parent:c.parent,category:c.category,accountType:a.type,account:a.name});
  }
  return {rows,errors};
}

const selMov=new Set();
const STATE_OPTS=[['','Todos'],['sincat','Sin categoría'],['norev','Sin revisar'],['noexp','Sin exportar a Bluecoins'],['pend','Pendientes'],['manual','Manuales'],['sinpareja','Transferencias sin pareja'],['dups','Posibles duplicados'],['cambiado','Cambiados tras exportar']];
function filteredMovs(){
  const f=ui.mf;
  return cached('flt|'+JSON.stringify([f.acc,f.from,f.to,f.cat,f.state,f.q]),()=>{
    const q=normText(f.q), qAmt=f.q&&/\d/.test(f.q)?parseAmount(f.q):null;
    let catSet=null;
    if(f.cat&&f.cat.startsWith('p:')) catSet=new Set([f.cat.slice(2),...catChildren(f.cat.slice(2)).map(c=>c.id)]);
    return allMovs().filter(m=>{
      if(f.acc&&m.accountId!==f.acc) return false;
      if(f.from&&m.date<f.from) return false;
      if(f.to&&m.date>f.to) return false;
      if(f.cat){ if(f.cat==='__none'){ if(m.categoryId||m.kind==='transferencia') return false; } else if(catSet){ if(!catSet.has(m.categoryId)) return false; } else if(m.categoryId!==f.cat) return false; }
      switch(f.state){
        case 'sincat': if(m.categoryId||m.kind==='transferencia') return false; break;
        case 'norev': if(m.reviewed) return false; break;
        case 'noexp': if(m.exportId) return false; break;
        case 'pend': if(!m.pending) return false; break;
        case 'manual': if(m.source!=='manual') return false; break;
        case 'sinpareja': if(m.kind!=='transferencia'||m.transferPairId) return false; break;
        case 'dups': if(!isDup(m)) return false; break;
        case 'cambiado': if(!m.changedAfterExport) return false; break;
      }
      if(q){
        const hay=normText([movConcept(m),m.rawConcept,m.detail,m.bankCategory,m.payee,m.notes,m.labels.join(' '),catLabel(m.categoryId)].join(' ')).includes(q);
        if(!hay&&!(qAmt!=null&&qAmt!==0&&Math.abs(m.amountCents)===Math.abs(qAmt))) return false;
      }
      return true;
    });
  });
}

function saveMovDialog(){
  const m=movEditing, imported=!!m&&m.source!=='manual';
  const unchanged=m&&JSON.stringify(movFormValues())===movFormSnap;
  const accountId=$('movAcc').value, date=$('movDate').value;
  let abs=parseAmount($('movAmount').value);
  if(!imported){
    if(!validYMD(date)){ showToast('La fecha no es válida',{error:true}); $('movDate').focus(); return false; }
    if(abs==null||abs===0){ $('movAmount').classList.add('bad'); showToast('Escribe un importe válido, por ejemplo 12,50',{error:true}); $('movAmount').focus(); return false; }
    abs=Math.abs(abs);
  }
  const other=$('movOther').value||null;
  if(movKind==='transferencia'&&!imported&&!(m&&m.transferPairId)&&!other){ showToast('Elige la otra cuenta de la transferencia',{error:true}); $('movOther').focus(); return false; }
  const fields={concept:$('movConcept').value.trim().slice(0,300),payee:$('movPayee').value.trim().slice(0,120),labels:splitLabels($('movLabels').value),notes:$('movNotes').value.trim().slice(0,2000),reviewed:$('movReviewed').checked};
  const categoryId=movKind==='transferencia'?null:($('movCat').value||null);
  closeDlg($('movDlg'));
  if(unchanged) return true;
  if(!m){
    commit(movKind==='transferencia'?'Transferencia añadida':'Movimiento añadido',cs=>{
      const base={...fields,date,valueDate:'',rawConcept:'',bankBalanceCents:null,pending:false,source:'manual',importId:null,fingerprint:'',occurrence:1,exportId:null,changedAfterExport:false,createdAt:nowISO()};
      if(movKind==='transferencia'){
        const pairId=uid();
        cs.put('movements',{...base,id:uid(),accountId,amountCents:-abs,kind:'transferencia',categoryId:null,transferPairId:pairId,transferAccountId:other});
        cs.put('movements',{...base,id:uid(),accountId:other,amountCents:abs,kind:'transferencia',categoryId:null,transferPairId:pairId,transferAccountId:accountId});
      } else cs.put('movements',{...base,id:uid(),accountId,amountCents:movKind==='gasto'?-abs:abs,kind:movKind,categoryId,transferPairId:null,transferAccountId:null});
    });
    return true;
  }
  commit('Movimiento guardado',cs=>{
    const cur=S.movements.get(m.id); if(!cur) throw new Error('El movimiento ya no existe');
    const n={...clone(cur),...fields,kind:movKind,categoryId};
    if(!imported){ n.accountId=accountId; n.date=date; n.amountCents=(movKind==='gasto'||(movKind==='transferencia'&&cur.amountCents<0))?-abs:abs; }
    if(movKind==='transferencia'&&!n.transferPairId){
      n.transferAccountId=other;
      /* Un movimiento manual que pasa a ser transferencia: se crea su pareja en la otra cuenta */
      if(!imported&&other){
        if(other===n.accountId) throw new Error('la cuenta de destino es la misma');
        n.transferPairId=uid();
        cs.put('movements',{...clone(n),id:uid(),accountId:other,amountCents:-n.amountCents,transferAccountId:n.accountId,categoryId:null,exportId:null,changedAfterExport:false,createdAt:nowISO()});
      }
    }
    if(movKind!=='transferencia'){ n.transferAccountId=null; }
    if(n.transferPairId&&n.source==='manual'){
      const p=[...S.movements.values()].find(x=>x.transferPairId===n.transferPairId&&x.id!==n.id);
      if(p&&p.accountId===n.accountId) throw new Error('las dos cuentas de la transferencia son la misma');
    }
    const sig=x=>JSON.stringify([x.accountId,x.date,x.amountCents,x.kind,x.categoryId,x.payee,x.notes,x.labels,x.transferAccountId]);
    if(n.exportId&&sig(n)!==sig(cur)) n.changedAfterExport=true;
    cs.put('movements',n);
    if(n.transferPairId&&n.source==='manual'){
      const p=[...S.movements.values()].find(x=>x.transferPairId===n.transferPairId&&x.id!==n.id);
      if(p){ const pn={...clone(p),date:n.date,amountCents:-n.amountCents,notes:n.notes,labels:n.labels,payee:n.payee,concept:n.concept,reviewed:n.reviewed,transferAccountId:n.accountId};
        if(pn.exportId&&sig(pn)!==sig(p)) pn.changedAfterExport=true; cs.put('movements',pn); }
    }
  });
  return true;
}

const GENERIC_CONCEPTS=new Set(['BIZUM','TRANSFERENCIA REALIZADA','TRANSFERENCIA RECIBIDA','ABONO POR TRANSFERENCIA A SU FAVOR','PAGO CON TARJETA','COMPRA']);
function suggestRuleText(m){
  const parts=String(m.rawConcept||m.concept||'').split(' · ').map(normText).filter(Boolean);
  let base=parts.find(p=>!GENERIC_CONCEPTS.has(p))||parts[0]||'';
  base=base.replace(/^(ADEUDO DE|ADEUDO|RECIBO|PAGO EN|PAGO CON TARJETA EN|COMPRA EN|COMPRA ING|COMPRA)\s+/,'');
  return base.split(' ').filter(w=>w&&!/\d/.test(w)&&w.length>1).slice(0,3).join(' ');
}

function applyRulesToFree(cs,only=null){
  let n=0;
  for(const m of [...S.movements.values()]){
    if(m.categoryId||m.kind==='transferencia') continue;
    const r=only?(ruleMatches(only,m)?only:null):matchRule(m); if(!r) continue;
    const t={kind:m.kind,categoryId:null,payee:m.payee,labels:m.labels,transferAccountId:null};
    applyRuleSet(t,r); if(!m.payee&&r.set.payee) t.payee=r.set.payee; else t.payee=m.payee||t.payee;
    const nm={...clone(m),kind:t.kind,categoryId:t.categoryId,payee:t.payee,labels:m.labels.length?m.labels:t.labels,transferAccountId:t.kind==='transferencia'?t.transferAccountId:null};
    if(JSON.stringify([nm.kind,nm.categoryId,nm.payee,nm.labels,nm.transferAccountId])===JSON.stringify([m.kind,m.categoryId,m.payee,m.labels,m.transferAccountId])) continue;
    if(nm.exportId) nm.changedAfterExport=true;
    cs.put('movements',nm); n++;
    const rr=S.rules.get(r.id); if(rr) cs.put('rules',{...clone(rr),hits:rr.hits+1});
  }
  return n;
}

/* ================= Importadores de cada banco ================= */
/* Cada importador reconoce su archivo por las cabeceras (nunca por el nombre) y devuelve filas normalizadas:
   {date, valueDate, amountCents, rawConcept, detail, bankCategory, bankBalanceCents, ident, settlementCard, line} */
const hdrNorm=s=>normText(s).replace(/[()€]/g,' ').replace(/\s*\.\s*/g,'.').replace(/\s+/g,' ').trim();
const digits=s=>String(s??'').replace(/\D/g,'');
const last4=s=>{ const d=digits(s); return d.length>=4?d.slice(-4):''; };
const maskId=s=>{ const l=last4(s); return l?'··'+l:''; };
const cellStr=c=>c&&c.v!=null?cleanCellText(c.t==='s'?c.v:cellText(c)):'';
function cellAmount(c){ if(!c) return null; if(c.t==='n') return parseAmount(c.raw??c.v,{decimal:'.'}); if(c.t==='s') return parseAmount(c.v); return null; }
function cellDate(c){ if(!c) return null; if(c.t==='d'||c.t==='n'||c.t==='s') return parseDateCell(c.v); return null; }
function findHeader(rows,spec){
  for(let i=0;i<Math.min(rows.length,40);i++){
    const names=(rows[i]||[]).map(c=>c?hdrNorm(cellStr(c)):'');
    const col={}; let ok=true;
    for(const [k,alts] of Object.entries(spec.req)){ const j=names.findIndex(n=>alts.includes(n)); if(j<0){ ok=false; break; } col[k]=j; }
    if(!ok) continue;
    for(const [k,alts] of Object.entries(spec.opt||{})){ const j=names.findIndex(n=>alts.includes(n)); if(j>=0) col[k]=j; }
    return {row:i,col};
  }
  return null;
}
/* Busca un rótulo encima de la cabecera (p. ej. «Número de cuenta:») y devuelve el texto de la celda siguiente */
function textAbove(rows,hrow,label){
  for(let i=0;i<hrow;i++){ const r=rows[i]||[];
    for(let j=0;j<r.length;j++) if(r[j]&&hdrNorm(cellStr(r[j])).startsWith(label)) for(let k=j+1;k<r.length;k++) if(r[k]&&cellStr(r[k])) return cellStr(r[k]); }
  return '';
}
const joinConcept=(a,b)=>{ a=cleanCellText(a||''); b=cleanCellText(b||''); if(!b) return a; if(!a) return b; return normText(a).includes(normText(b))?a:a+' · '+b; };
const IMPORTERS=[
  {id:'bbva_cuenta',bank:'bbva',card:false,label:'BBVA · cuenta',
    req:{fecha:['FECHA'],valor:['F.VALOR'],concepto:['CONCEPTO'],importe:['IMPORTE'],saldo:['DISPONIBLE']},opt:{mov:['MOVIMIENTO'],obs:['OBSERVACIONES'],divisa:['DIVISA']},
    row(r,c){
      const date=cellDate(r[c.fecha]), amt=cellAmount(r[c.importe]); if(!date||amt==null) return null;
      const concepto=cellStr(r[c.concepto]), mov=c.mov!=null?cellStr(r[c.mov]):'';
      return {date,valueDate:cellDate(r[c.valor])||'',amountCents:amt,rawConcept:joinConcept(concepto,mov),detail:c.obs!=null?cellStr(r[c.obs]):'',
        bankBalanceCents:cellAmount(r[c.saldo]),currency:c.divisa!=null?cellStr(r[c.divisa]):'',

    }},
  {id:'bbva_tarjeta',bank:'bbva',card:true,label:'BBVA · tarjeta',

    row(r,c){

      const concepto=cellStr(r[c.concepto]);
      return {date,valueDate:'',amountCents:amt,rawConcept:concepto,detail:'',bankBalanceCents:null,currency:c.divisa!=null?cellStr(r[c.divisa]):'',ident:cellStr(r[c.tarjeta]),
        cardReceipt:/^RECIBO MES ANTERIOR/.test(normText(concepto))};
    }},
  {id:'ing_cuenta',bank:'ing',card:false,label:'ING · cuenta',
    req:{valor:['F.VALOR'],descripcion:['DESCRIPCION'],importe:['IMPORTE'],saldo:['SALDO']},opt:{cat:['CATEGORIA'],sub:['SUBCATEGORIA'],comentario:['COMENTARIO']},
    ident:(rows,h)=>textAbove(rows,h.row,'NUMERO DE CUENTA'),
    row(r,c){
      const date=cellDate(r[c.valor]), amt=cellAmount(r[c.importe]); if(!date||amt==null) return null;
      const cat=c.cat!=null?cellStr(r[c.cat]):'', sub=c.sub!=null?cellStr(r[c.sub]):'';
      return {date,valueDate:date,amountCents:amt,rawConcept:joinConcept(cellStr(r[c.descripcion]),c.comentario!=null?cellStr(r[c.comentario]):''),detail:'',

const importerOf=id=>IMPORTERS.find(x=>x.id===id);
/* Saldo encadenado: comprueba saldo anterior + importe = saldo, en el orden del archivo (descendente o ascendente) */
function chainCheck(rows){
  if(rows.filter(r=>isInt(r.bankBalanceCents)).length<2) return null;
  const errs=desc=>{ const bad=[]; for(let i=0;i<rows.length-1;i++){ const a=rows[i], b=rows[i+1];
    if(!isInt(a.bankBalanceCents)||!isInt(b.bankBalanceCents)) continue;
    if(!(desc?a.bankBalanceCents===b.bankBalanceCents+a.amountCents:b.bankBalanceCents===a.bankBalanceCents+b.amountCents)) bad.push(i); } return bad; };
  const d=errs(true), a=errs(false), desc=d.length<=a.length;
  const oldest=desc?rows[rows.length-1]:rows[0], newest=desc?rows[0]:rows[rows.length-1];
  return {order:desc?'desc':'asc',breaks:desc?d:a,opening:oldest.bankBalanceCents-oldest.amountCents,openingDate:oldest.date,closing:newest.bankBalanceCents,closingDate:newest.date};
}
function analyzeFile(f){
  for(let si=0;si<f.sheets.length;si++){
    const rows=f.sheets[si].rows;
    for(const im of IMPORTERS){
      const h=findHeader(rows,im); if(!h) continue;
      const out=[], warnings=[];
      for(let i=h.row+1;i<rows.length;i++){ const r=rows[i]||[]; if(!r.some(Boolean)) continue; const x=im.row(r,h.col); if(x){ x.line=i+1; out.push(x); } }
      if(!out.length) continue;
      let ident=im.ident?im.ident(rows,h):'';
      if(!ident){ const ids=[...new Set(out.map(x=>x.ident).filter(Boolean))]; if(ids.length===1) ident=ids[0]; else if(ids.length>1) warnings.push('El archivo mezcla varias tarjetas: '+ids.map(maskId).join(', ')); }
      const cur=[...new Set(out.map(x=>x.currency).filter(c=>c&&!/^(EUR|€)$/i.test(c)))];
      if(cur.length) warnings.push('Hay importes en otra moneda: '+cur.join(', '));
      const dates=out.map(x=>x.date).sort();
      return {importerId:im.id,sheet:si,rows:out,ident,warnings,from:dates[0],to:dates[dates.length-1],chain:chainCheck(out)};
    }
  }
  return null;
}

/* ----- Cuenta de destino del archivo ----- */
const accCompatible=(a,im)=>a.bank===im.bank&&im.card===a.kind.startsWith('tarjeta');
function hintMatch(a,ident){ const d=digits(ident); return !!d&&a.matchHints.some(h=>{ const hd=digits(h); return hd.length>=4&&d.endsWith(hd); }); }
function fpCounts(accountId){ return cached('fp|'+accountId,()=>{ const m=new Map(); for(const x of S.movements.values()) if(x.accountId===accountId&&x.fingerprint) m.set(x.fingerprint,(m.get(x.fingerprint)||0)+1); return m; }); }
const rowFp=(accountId,r)=>fingerprint({accountId,date:r.date,amountCents:r.amountCents,rawConcept:r.rawConcept,bankBalanceCents:r.bankBalanceCents});
function guessAccount(an){
  const im=importerOf(an.importerId), accs=accSorted(true);
  if(an.ident){ const m=accs.filter(a=>hintMatch(a,an.ident)); if(m.length===1) return m[0].id; }
  const comp=accs.filter(a=>accCompatible(a,im)&&!a.archived);
  for(const a of comp){ const fc=fpCounts(a.id); if(an.rows.some(r=>fc.has(rowFp(a.id,r)))) return a.id; }
  if(comp.length===1&&!(an.ident&&comp[0].matchHints.length)) return comp[0].id;
  return '';
}

/* ----- Reglas de categorización ----- */
const rulesSorted=()=>cached('rules',()=>[...S.rules.values()].sort((a,b)=>a.priority-b.priority||(a.updatedAt||'').localeCompare(b.updatedAt||'')));
const ruleHay=m=>normText([m.rawConcept,m.detail,m.bankCategory,m.concept].filter(Boolean).join(' '));
function ruleMatches(r,m,hay=ruleHay(m)){
  if(r.accountId&&r.accountId!==m.accountId) return false;
  if(r.sign==='neg'&&!(m.amountCents<0)) return false;
  if(r.sign==='pos'&&!(m.amountCents>0)) return false;
  if(r.mode==='regex'){ try{ return new RegExp(r.text,'i').test(hay); }catch(e){ return false; } }
  const t=normText(r.text); if(!t) return false;
  return r.mode==='empieza'?hay.startsWith(t):hay.includes(t);
}
function matchRule(m){ const hay=ruleHay(m); for(const r of rulesSorted()) if(ruleMatches(r,m,hay)) return r; return null; }
function applyRuleSet(m,r){
  const s=r.set; m.ruleId=r.id;
  if(s.payee) m.payee=s.payee;
  if(s.labels.length) m.labels=[...s.labels];
  if(s.kind) m.kind=s.kind;
  if(s.categoryId&&S.categories.has(s.categoryId)){ m.categoryId=s.categoryId; if(!s.kind) m.kind=S.categories.get(s.categoryId).kind; }
  if(m.kind==='transferencia'){ m.categoryId=null; m.transferAccountId=s.transferAccountId||null; }
}
/* ----- Transferencias entre cuentas propias: importe opuesto, ±3 días, sin pareja ----- */
const TRANSFER_RX=/TRANSF|TRASPASO|TRASP\b/;
const movsByAmount=()=>cached('byAmt',()=>{ const m=new Map(); for(const x of S.movements.values()){ const l=m.get(x.amountCents); if(l) l.push(x); else m.set(x.amountCents,[x]); } return m; });
function findCounterpart(x,forced=false,claimed=null){
  const hay=x.hay||'';
  const c=(movsByAmount().get(-x.amountCents)||[]).filter(o=>o.accountId!==x.accountId&&!o.transferPairId&&!(claimed&&claimed.has(o.id))&&Math.abs(daysBetween(o.date,x.date))<=3
    &&(!o.transferAccountId||o.transferAccountId===x.accountId)&&(!x.transferAccountId||x.transferAccountId===o.accountId)
    &&(forced||o.kind==='transferencia'||TRANSFER_RX.test(hay)||TRANSFER_RX.test(ruleHay(o))));
  return c.length===1?c[0]:null;
}
function classifyRow(r,accountId,claimed=null){
  const m={kind:r.amountCents<0?'gasto':'ingreso',categoryId:null,payee:'',labels:[],transferAccountId:null,ruleId:null,note:'',pairWith:null,settlement:false};
  /* Liquidación mensual de la tarjeta: en la cuenta («Adeudo mensual de tarjeta») y en la tarjeta («Recibo mes anterior») */
  if(r.settlementCard){
    const card=accSorted(true).find(a=>a.kind.startsWith('tarjeta')&&hintMatch(a,r.settlementCard));
    Object.assign(m,{kind:'transferencia',transferAccountId:card?card.id:null,settlement:true,note:card?'Liquidación de la tarjeta':'Liquidación de la tarjeta '+maskId(r.settlementCard)+': no hay ninguna cuenta con esos dígitos'});
  } else if(r.cardReceipt){
    const host=S.accounts.get(accountId)?.linkedAccountId||null;
    Object.assign(m,{kind:'transferencia',transferAccountId:host,settlement:true,note:host?'Liquidación de la tarjeta':'Liquidación: indica en la cuenta de la tarjeta en qué cuenta se carga'});
  }
  if(m.settlement){
    const c=m.transferAccountId&&findCounterpart({accountId,date:r.date,amountCents:r.amountCents,hay:'',transferAccountId:m.transferAccountId},true,claimed);
    if(c){ m.pairWith=c.id; claimed&&claimed.add(c.id); }
    return m;
  }
  const rule=matchRule({...r,accountId}); if(rule) applyRuleSet(m,rule);
  const c=findCounterpart({accountId,date:r.date,amountCents:r.amountCents,hay:ruleHay(r),transferAccountId:m.kind==='transferencia'?m.transferAccountId:null},m.kind==='transferencia',claimed);
  if(c){ claimed&&claimed.add(c.id); Object.assign(m,{kind:'transferencia',categoryId:null,transferAccountId:c.accountId,pairWith:c.id,note:'Se empareja con un movimiento de '+accName(c.accountId)}); }
  return m;
}

/* ----- Revisión antes de confirmar ----- */
function buildReview(fi){
  const f=imp.files[fi], an=f&&f.analysis; if(!an) return null;
  let rv=f.review;
  if(!rv) rv=f.review={accountId:guessAccount(an),edits:new Map(),showDups:false,page:0,setOpening:null,addHint:null};
  if(rv.accountId&&!S.accounts.has(rv.accountId)) rv.accountId='';
  const accId=rv.accountId, acc=accId&&S.accounts.get(accId), fc=accId?fpCounts(accId):new Map(), seen=new Map(), claimed=new Set();
  rv.rows=an.rows.map((r,i)=>{
    const fp=accId?rowFp(accId,r):'', occ=(seen.get(fp)||0)+1; seen.set(fp,occ);
    const dup=!!accId&&occ<=(fc.get(fp)||0);
    let cls=null;
    if(accId&&!dup){
      cls=classifyRow(r,accId,claimed);
      const e=rv.edits.get(i);
      if(e){ Object.assign(cls,e); if(e.kind&&e.kind!=='transferencia'){ cls.transferAccountId=null; cls.pairWith=null; cls.settlement=false; } if(e.kind) cls.note=''; }
    }
    return {i,r,fp,occ,dup,cls};
  });
  rv.newCount=rv.rows.filter(x=>!x.dup).length; rv.dupCount=rv.rows.length-rv.newCount;
  const w=[...an.warnings];
  if(an.chain&&an.chain.breaks.length) w.push(`El saldo del archivo no encadena en ${an.chain.breaks.length} ${an.chain.breaks.length===1?'punto':'puntos'} (primera vez en la fila ${an.rows[an.chain.breaks[0]].line} del archivo): puede faltar o sobrar algún movimiento.`);
  rv.openingOffer=null; rv.hintOffer=null;
  if(acc){
    const own=[...S.movements.values()].filter(m=>m.accountId===accId&&m.source==='import');
    if(own.length&&rv.newCount){
      const last=own.reduce((x,m)=>m.date>x?m.date:x,''), first=own.reduce((x,m)=>m.date<x?m.date:x,'9999');
      if(!rv.dupCount&&an.from>addDays(last,1)) w.push(`No se solapa con lo ya importado: entre el ${fmtDate(addDays(last,1))} y el ${fmtDate(addDays(an.from,-1))} no habrá movimientos de esta cuenta.`);
      if(!rv.dupCount&&an.to<addDays(first,-1)) w.push(`No se solapa con lo ya importado: entre el ${fmtDate(addDays(an.to,1))} y el ${fmtDate(addDays(first,-1))} no habrá movimientos de esta cuenta.`);
    }
    if(an.chain&&(!acc.openingDate||an.chain.openingDate<acc.openingDate)){
      rv.openingOffer={cents:an.chain.opening,date:an.chain.openingDate};
      if(rv.setOpening===null) rv.setOpening=true;
    } else if(acc.openingDate&&an.from<acc.openingDate) w.push(`Hay movimientos anteriores a la fecha de apertura de la cuenta (${fmtDate(acc.openingDate)}): no contarán en el saldo.`);
    if(an.ident&&!hintMatch(acc,an.ident)&&last4(an.ident)){ rv.hintOffer=last4(an.ident); if(rv.addHint===null) rv.addHint=true; }
    const noCard=rv.rows.filter(x=>x.cls&&x.cls.settlement&&!x.cls.transferAccountId).length;
    if(noCard) w.push(importerOf(an.importerId).card
      ?`${noCard} ${noCard===1?'recibo':'recibos'} de la liquidación sin cuenta de cargo: edita esta tarjeta en Cuentas e indica en qué cuenta se carga.`
      :`${noCard} ${noCard===1?'liquidación':'liquidaciones'} de tarjeta sin cuenta de tarjeta: crea la cuenta de la tarjeta con sus últimos 4 dígitos para que no cuenten como gasto.`);
  }
  rv.warnings=w;
  return rv;
}

async function confirmImport(fi){

  const ok=await commit('',cs=>{
    const ids=[], pairChanges=[], hits=new Map();

      const m={id:uid(),accountId:acc.id,date:r.date,valueDate:r.valueDate||'',amountCents:r.amountCents,rawConcept:r.rawConcept,concept:'',payee:(c.payee||'').trim().slice(0,120),
        categoryId:isT?null:(c.categoryId||null),notes:'',labels:c.labels||[],bankBalanceCents:isInt(r.bankBalanceCents)?r.bankBalanceCents:null,pending:false,kind:c.kind,
        transferPairId:null,transferAccountId:isT?(c.transferAccountId||null):null,source:'import',importId,fingerprint:x.fp,occurrence:x.occ,
        detail:r.detail||'',bankCategory:r.bankCategory||'',exportId:null,changedAfterExport:false,reviewed:false,createdAt:now};
      if(c.ruleId) hits.set(c.ruleId,(hits.get(c.ruleId)||0)+1);
      if(isT&&m.transferAccountId){

        if(o){ const pid=uid(); pairChanges.push({id:o.id,before:clone(o)});
          cs.put('movements',{...clone(o),kind:'transferencia',categoryId:null,transferPairId:pid,transferAccountId:acc.id,changedAfterExport:o.exportId?true:o.changedAfterExport});
          m.transferPairId=pid; bumpData(); }
      }
      cs.put('movements',m); ids.push(m.id);
    }
    for(const [rid,n] of hits){ const r=S.rules.get(rid); if(r) cs.put('rules',{...clone(r),hits:r.hits+n}); }
    let openingBefore=null, hintAdded='';
    const na=clone(acc);
    if(rv.openingOffer&&rv.setOpening){ openingBefore={openingCents:acc.openingCents,openingDate:acc.openingDate}; na.openingCents=rv.openingOffer.cents; na.openingDate=rv.openingOffer.date; }
    if(rv.hintOffer&&rv.addHint){ hintAdded=rv.hintOffer; na.matchHints=[...na.matchHints,hintAdded]; }
    if(openingBefore||hintAdded) cs.put('accounts',na);
    let checkId=null, diff=null;
    if(an.chain){
      bumpData();
      const app=balanceAt(acc.id,an.chain.closingDate); diff=app-an.chain.closing; checkId=uid();
      cs.put('checks',{id:checkId,accountId:acc.id,date:an.chain.closingDate,realCents:an.chain.closing,appCents:app,bluecoinsCents:null,diffCents:diff,note:'Automático al importar '+f.name.slice(0,120),createdAt:now});
    }
    cs.put('imports',{id:importId,at:now,fileName:f.name,fileHash:f.hash,importer:an.importerId,bank:im.bank,accountId:acc.id,from:an.from,to:an.to,
      rows:an.rows.length,added:news.length,duplicates:rv.dupCount,movementIds:ids,pairChanges,checkId,openingBefore,hintAdded,warnings:rv.warnings});
    const tail=diff==null?'':diff===0?' · el saldo cuadra':` · descuadre de ${money(Math.abs(diff))}`;
    return (news.length?`${news.length} movimientos importados en ${acc.name}`:`Archivo registrado sin movimientos nuevos`)+tail;
  });
  if(!ok) return;
  f.review=null; imp.raw=false;
  const next=imp.files.findIndex(x=>x.analysis&&!fileImported(x));
  if(next>=0){ imp.sel=next; imp.sheet=0; }

}
async function undoImport(id){
  const im=S.imports.get(id); if(!im) return;
  const ids=im.movementIds||[], exp=ids.filter(x=>S.movements.get(x)?.exportId).length;
  if(!await askConfirm('Deshacer importación',`<p>Se quitarán los ${NF_INT.format(ids.length)} movimientos que añadió «${esc(im.fileName)}»${(im.pairChanges||[]).length?' y las transferencias que emparejó volverán a como estaban':''}.${exp?` <b>${exp} ya se exportaron a Bluecoins</b>: tendrás que borrarlos también allí.`:''}</p>`,'Deshacer importación',true)) return;
  commit('Importación deshecha',cs=>{
    const set=new Set(ids), restore=new Set((im.pairChanges||[]).map(p=>p.id));
    for(const mid of ids){
      const m=S.movements.get(mid); if(!m) continue;
      if(m.transferPairId) for(const o of [...S.movements.values()].filter(o=>o.transferPairId===m.transferPairId&&!set.has(o.id)&&!restore.has(o.id))) cs.put('movements',{...clone(o),transferPairId:null});
      cs.del('movements',mid);
    }
    for(const pc of im.pairChanges||[]) if(S.movements.has(pc.id)){ const n=normMovement(pc.before); if(n) cs.put('movements',n); }
    if(im.checkId) cs.del('checks',im.checkId);
    const a=S.accounts.get(im.accountId);
    if(a&&(im.openingBefore||im.hintAdded)){ const na=clone(a);
      if(im.openingBefore){ na.openingCents=im.openingBefore.openingCents; na.openingDate=im.openingBefore.openingDate; }
      if(im.hintAdded) na.matchHints=na.matchHints.filter(h=>h!==im.hintAdded);
      cs.put('accounts',na); }
    cs.del('imports',id);
  });
}

async function readFiles(files,{onlyNew=false,quiet=false}={}){
  if(!files.length) return 0;
  imp.busy=true; if(ui.view==='importar') renderImport();
  let added=0, skipped=0;
  try{
    for(const file of files){
      const r=await readSpreadsheet(file);
      if(imp.files.some(x=>x.hash===r.hash)){ skipped++; continue; }
      try{ r.analysis=r.error?null:analyzeFile(r); }catch(e){ console.error(e); r.analysis=null; }
      if(onlyNew&&[...S.imports.values()].some(x=>x.fileHash===r.hash)){ skipped++; continue; }
      imp.files.push(r); added++;
    }
    if(added){ imp.sel=imp.files.length-added; imp.sheet=0; imp.raw=false; }
  } finally { imp.busy=false; }
  if(quiet){
    if(ui.view==='importar') renderImport();
    if(added) showToast(`${added} archivos nuevos en la carpeta de importación`,{action:'Ver',fn:()=>go('importar')});
    return added;
  }
  if(ui.view!=='importar') go('importar'); else renderImport();
  if(onlyNew) showToast(added?`${added} archivos nuevos`:'No hay archivos nuevos'+(skipped?` (${skipped} ya vistos)`:''));
  return added;
}
function bindDrop(z){
  if(!z) return;
  z.addEventListener('dragover',e=>{ e.preventDefault(); z.classList.add('over'); });
  z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',e=>{ e.preventDefault(); z.classList.remove('over'); readFiles([...e.dataTransfer.files]); });
}

window.addEventListener('drop',e=>{ if(e.target.closest&&e.target.closest('#dropZone')) return; if(e.dataTransfer&&e.dataTransfer.files.length){ e.preventDefault(); readFiles([...e.dataTransfer.files]); } });

async function pickFolder(){
  if(!window.showDirectoryPicker){ showToast('Este navegador no permite elegir carpetas: usa «Elegir archivos»'); return; }
  try{ const h=await window.showDirectoryPicker({id:'fin-importar',mode:'read'}); await setMeta('importFolder',h); imp.needsPerm=false; await scanFolder(true); }
  catch(e){ if(e.name!=='AbortError') showToast('No se ha podido abrir la carpeta: '+e.message,{error:true}); }

async function scanFolder(gesture){
  const h=getMeta('importFolder'); if(!h||!h.queryPermission) return;
  try{
    let p=await h.queryPermission({mode:'read'});
    if(p!=='granted'){
      if(!gesture){ imp.needsPerm=true; if(ui.view==='importar') renderImport(); return; }
      p=await h.requestPermission({mode:'read'});
      if(p!=='granted'){ imp.needsPerm=true; renderImport(); showToast('Sin permiso para leer la carpeta'); return; }
    }
    imp.needsPerm=false;
    const files=[];
    for await (const [name,entry] of h.entries()) if(entry.kind==='file'&&/\.(xlsx?|csv|txt|html?|xml)$/i.test(name)) files.push(await entry.getFile());
    if(!files.length){ if(gesture) showToast('La carpeta no tiene archivos de banco'); else if(ui.view==='importar') renderImport(); return; }
    await readFiles(files,{onlyNew:true,quiet:!gesture});
  }catch(e){ showToast('No se ha podido leer la carpeta: '+e.message,{error:true}); }
}

const catExists=(parent,name,except)=>[...S.categories.values()].some(c=>c.id!==except&&(c.parent||null)===(parent||null)&&c.name.trim().toLowerCase()===name.trim().toLowerCase());
async function newParentCat(){

async function renameCat(id){

function deleteCat(id){
  const c=S.categories.get(id); if(!c) return;
  const ids=[id,...catChildren(id).map(x=>x.id)];
  const n=[...S.movements.values()].filter(m=>ids.includes(m.categoryId)).length;
  if(n){ showToast(`No se puede eliminar: la usan ${n} movimientos.`,{error:true}); return; }
  commit(ids.length>1?'Categoría y subcategorías eliminadas':'Categoría eliminada',cs=>{ for(const x of ids) cs.del('categories',x); });
}
/* Cada línea: «Padre > Subcategoría» (o «Padre;Subcategoría»). Solo se añade lo que falta. */
function parseCatLines(text){
  const out=[];
  for(const line of String(text).split(/\r?\n/)){
    const parts=line.split(/\s*(?:>|›|;|\t)\s*/).map(s=>s.trim()).filter(Boolean);
    if(!parts.length) continue;
    out.push({parent:parts[0].slice(0,80),child:parts[1]?parts.slice(1).join(' ').slice(0,80):null});
  }
  return out;
}
async function pasteCats(){
  const r=await askFields('Pegar lista de categorías',[{id:'kind',label:'Tipo',type:'select',value:'gasto',options:[['gasto','Gasto'],['ingreso','Ingreso']]},{id:'text',label:'Una por línea: Padre > Subcategoría',type:'textarea',placeholder:'Comida > Supermercado\nComida > Restaurantes\nCasa > Luz'}],'Añadir');
  if(!r) return;
  const lines=parseCatLines(r.text); if(!lines.length) return;
  commit('',cs=>{
    let n=0;
    const findP=name=>[...S.categories.values()].find(c=>!c.parent&&c.kind===r.kind&&c.name.trim().toLowerCase()===name.trim().toLowerCase());
    for(const {parent,child} of lines){
      let p=findP(parent); if(!p){ p=cs.put('categories',{id:uid(),parent:null,name:parent,kind:r.kind}); n++; }
      if(child&&!catExists(p.id,child)){ cs.put('categories',{id:uid(),parent:p.id,name:child,kind:r.kind}); n++; }
    }
    return n?`${n} categorías añadidas`:false;
  });
}

  if(!data||data.app!==APP_ID||!data.stores||typeof data.stores!=='object'){ showToast('El archivo no es una copia de esta app',{error:true}); return; }
  const incoming={}, bad=[];
  for(const s of STORES){ incoming[s]=[]; for(const r of Array.isArray(data.stores[s])?data.stores[s]:[]){ const n=NORM[s](r); if(n&&!(s==='meta'&&META_NO_BACKUP.has(n.key))) incoming[s].push(n); else if(!n) bad.push({store:s,raw:r}); } }
  const ok=await askConfirm('Restaurar copia',`<p>Copia del <b>${fmtDT(data.exportedAt)}</b>: ${NF_INT.format(incoming.movements.length)} movimientos, ${incoming.accounts.length} cuentas, ${incoming.categories.length} categorías.</p>

  if(!ok) return;
  await commit('Copia restaurada',cs=>{
    for(const s of STORES){
      for(const k of [...S[s].keys()]) if(!(s==='meta'&&META_NO_BACKUP.has(k))) cs.del(s,k);
      for(const r of incoming[s]) cs.put(s,r);

});

  <li>Revisa la lista: <b>Nuevo</b> son los que se añadirán; los que ya estaban (de otra descarga que se solapa) no se vuelven a meter. Puedes cambiar el tipo, la categoría y el beneficiario antes de confirmar.</li>
